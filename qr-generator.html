<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orderly — QR Generator</title><link rel="stylesheet" href="style.css"><style>.qr-wrap{max-width:1000px;margin:24px auto;padding:0 16px 80px}.qr-head{margin-bottom:16px}.qr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.qr-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}.qr-card img{max-width:240px;width:100%;height:auto;border-radius:10px}.qr-url{font-size:11px;color:var(--muted);word-break:break-all;text-align:left;margin-top:9px}.row{display:grid;grid-template-columns:1.5fr 1fr auto;gap:8px;align-items:end}.row input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}.qr-msg{margin-top:12px;padding:11px 12px;border-radius:10px;background:#f7f7f8;font-size:13px;color:var(--muted)}@media(max-width:850px){.qr-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.qr-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head>
<body><header class="topbar"><div class="brand"><div class="brand-title">Orderly</div><div class="brand-sub">Table QR generator</div></div><div class="header-right"><a href="admin.html">Dashboard</a></div></header>
<main class="qr-wrap"><section class="card qr-head"><h1 style="margin-top:0">Table QR generator</h1><p class="small">Every table gets its own ordering URL, so T1 and T2 produce different QR codes.</p><div class="row"><div><label class="small">Restaurant slug</label><input id="restaurant" value="orderly-demo"></div><div><label class="small">Manual table</label><input id="table" value="T1"></div><button class="btn primary" id="generateOne">Generate one</button></div><div class="actions-row"><button class="btn ghost" id="loadAll">Load all active tables</button><a class="btn ghost" href="index.html">Customer page</a></div><div id="msg" class="qr-msg">Use the manual generator or load the active table list.</div></section><section id="qrGrid" class="qr-grid"></section></main>
<script src="supabase-config.js"></script><script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";const cfg=window.ORDERLY_SUPABASE_CONFIG||{};const supabase=cfg.url&&cfg.anonKey&&!String(cfg.url).includes("REPLACE_ME")?createClient(cfg.url,cfg.anonKey):null;const $=id=>document.getElementById(id);const base=new URL("index.html",location.href).href;
function tableUrl(r,t){return base+"?restaurant="+encodeURIComponent(r)+"&table="+encodeURIComponent(t)}function card(r,t){const u=tableUrl(r,t);return '<article class="qr-card"><h2 style="margin:0 0 10px">'+t+'</h2><img alt="QR code for '+t+'" src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&data='+encodeURIComponent(u)+'"><div class="qr-url">'+u+'</div><div class="actions-row"><a class="btn ghost" target="_blank" rel="noopener" href="'+u+'">Open table menu</a></div></article>'}function render(items){$("qrGrid").innerHTML=items.map(t=>card($("restaurant").value.trim()||"orderly-demo",t)).join("")}
$("generateOne").onclick=()=>{const r=$("restaurant").value.trim()||"orderly-demo",t=$("table").value.trim().toUpperCase()||"T1";render([t]);$("msg").textContent=r+"/"+t+" generated. Different table numbers create different URLs and QR codes."};
$("loadAll").onclick=async()=>{if(!supabase){$("msg").textContent="Supabase is not configured.";return}const rname=$("restaurant").value.trim()||"orderly-demo";const r=await supabase.from("restaurants").select("id").eq("slug",rname).single();if(r.error){$("msg").textContent="Restaurant not found.";return}const t=await supabase.from("tables").select("table_no").eq("restaurant_id",r.data.id).eq("is_active",true).order("table_no");if(t.error){$("msg").textContent="Could not load tables.";return}const items=(t.data||[]).map(x=>x.table_no);render(items);$("msg").textContent=items.length+" active table QR code(s) generated. Each table has a different table parameter in the URL."};
const p=new URLSearchParams(location.search);if(p.get("restaurant"))$("restaurant").value=p.get("restaurant");if(p.get("table")){$("table").value=p.get("table");$("generateOne").click()}else $("generateOne").click();
</script></body></html>
