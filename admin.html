<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orderly — Live Dashboard</title><link rel="stylesheet" href="style.css"><style>.admin-wrap{max-width:1200px;margin:0 auto;padding:20px 16px 90px}.admin-head{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:16px}.admin-title{margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:#f7f7f8;border:1px solid #e8e8e8;border-radius:14px;padding:14px}.stat strong{display:block;font-size:24px;margin-top:4px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filter{border:1px solid #ddd;background:#fff;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700}.filter.active{background:#111;color:#fff;border-color:#111}.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.order-card{background:#fff;border:1px solid #e6e6e6;border-radius:16px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.05)}.order-top{display:flex;justify-content:space-between;gap:10px}.order-id{font-size:12px;color:#777}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}.pill.new{background:#fff3cd}.pill.preparing{background:#e9f2ff}.pill.ready{background:#eaf7ee}.pill.completed{background:#efefef}.pill.cancelled{background:#fdeaea}.order-items{margin:12px 0;padding:10px;background:#fafafa;border-radius:10px}.order-item-line{display:flex;justify-content:space-between;gap:8px;margin:5px 0}.order-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{grid-column:1/-1;text-align:center;padding:40px;color:#777;border:1px dashed #ddd;border-radius:14px}@media(max-width:900px){.orders{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.orders{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><header class="topbar"><div class="brand"><div class="brand-title">Orderly</div><div class="brand-sub">Live order dashboard</div></div><div class="header-right"><span id="connectionState">Demo mode</span></div></header><main class="admin-wrap"><div class="admin-head"><div><h1 class="admin-title">Orders</h1><div class="small">Restaurant operations dashboard</div></div><div class="actions-row"><button class="btn ghost" id="seedDemo">Load demo orders</button><button class="btn ghost" id="clearDemo">Clear demo data</button></div></div><section class="stats"><div class="stat">New<strong id="statNew">0</strong></div><div class="stat">Preparing<strong id="statPreparing">0</strong></div><div class="stat">Ready<strong id="statReady">0</strong></div><div class="stat">Revenue<strong id="statRevenue">₹0</strong></div></section><div class="filters" id="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="new">New</button><button class="filter" data-filter="preparing">Preparing</button><button class="filter" data-filter="ready">Ready</button><button class="filter" data-filter="completed">Completed</button><button class="filter" data-filter="cancelled">Cancelled</button></div><section id="orders" class="orders"><div class="empty">Waiting for orders…</div></section></main><script src="supabase-config.js"></script><script type="module" src="supabase-admin.js"></script></body></html>
