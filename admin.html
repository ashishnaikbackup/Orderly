<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orderly — Restaurant Dashboard</title><link rel="stylesheet" href="style.css">
<style>.admin-wrap{max-width:1200px;margin:0 auto;padding:20px 16px 90px}.admin-head{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:16px}.admin-title{margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:#f7f7f8;border:1px solid #e8e8e8;border-radius:14px;padding:14px}.stat strong{display:block;font-size:24px;margin-top:4px}.filters,.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filter,.tab-btn{border:1px solid #ddd;background:#fff;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700}.filter.active,.tab-btn.active{background:#111;color:#fff;border-color:#111}.orders,.manager-grid,.table-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.order-card,.manager-card,.table-card{background:#fff;border:1px solid #e6e6e6;border-radius:16px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.05)}.order-top{display:flex;justify-content:space-between;gap:10px}.order-id{font-size:12px;color:#777}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}.pill.new{background:#fff3cd}.pill.preparing{background:#e9f2ff}.pill.ready{background:#eaf7ee}.pill.completed{background:#efefef}.pill.cancelled{background:#fdeaea}.order-items{margin:12px 0;padding:10px;background:#fafafa;border-radius:10px}.order-item-line,.table-row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:7px 0}.order-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.manager-form{display:grid;grid-template-columns:2fr 2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:14px}.manager-form input,.table-row input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}.toggle{display:flex;align-items:center;gap:7px;font-size:13px}.muted-box{padding:12px;background:#f7f7f8;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:13px}.qr-link{font-size:12px;word-break:break-all}.empty{text-align:center;padding:40px;color:#777;border:1px dashed #ddd;border-radius:14px}.empty-wide{grid-column:1/-1}@media(max-width:1000px){.orders,.manager-grid,.table-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.manager-form{grid-template-columns:1fr 1fr 1fr 1fr}.manager-form .wide{grid-column:1/-1}}@media(max-width:650px){.orders,.manager-grid,.table-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.manager-form{grid-template-columns:1fr}.manager-form .wide{grid-column:auto}}</style></head>
<body><header class="topbar"><div class="brand"><div class="brand-title">Orderly</div><div class="brand-sub">Restaurant operations dashboard</div></div><div class="header-right"><span id="connectionState">Checking access…</span></div></header>
<main class="admin-wrap"><div class="admin-head"><div><h1 class="admin-title">Orderly Dashboard</h1><div class="small" id="staffInfo">Checking staff access…</div></div><button class="btn ghost" id="logoutBtn">Sign out</button></div>
<nav class="admin-tabs"><button class="tab-btn active" data-section="ordersSection">Orders</button><button class="tab-btn" data-section="menuSection">Menu</button><button class="tab-btn" data-section="tablesSection">Tables & QR</button></nav>
<section id="ordersSection"><section class="stats"><div class="stat">New<strong id="statNew">0</strong></div><div class="stat">Preparing<strong id="statPreparing">0</strong></div><div class="stat">Ready<strong id="statReady">0</strong></div><div class="stat">Revenue<strong id="statRevenue">₹0</strong></div></section>
<div class="filters" id="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="new">New</button><button class="filter" data-filter="preparing">Preparing</button><button class="filter" data-filter="ready">Ready</button><button class="filter" data-filter="completed">Completed</button><button class="filter" data-filter="cancelled">Cancelled</button></div>
<section id="orders" class="orders"><div class="empty empty-wide">Waiting for orders…</div></section></section>
<section id="menuSection" hidden><div id="menuAccessNote" class="muted-box" hidden>Kitchen staff have view-only access to the menu. Owners and managers can edit it.</div>
<section class="manager-card" id="menuManagerCard"><h2 style="margin-top:0">Menu management</h2><div class="manager-form"><div class="wide"><label class="small">Name</label><input id="menuName" placeholder="Item name"></div><div class="wide"><label class="small">Description</label><input id="menuDesc" placeholder="Short description"></div><div><label class="small">Price</label><input id="menuPrice" type="number" min="0" step="0.01" placeholder="120"></div><div><label class="small">Category</label><input id="menuCategory" placeholder="Main Course"></div><button class="btn primary" id="addMenuBtn">Add item</button></div><div id="menuList" class="manager-grid"><div class="empty empty-wide">Loading menu…</div></div></section></section>
<section id="tablesSection" hidden><section class="manager-card"><h2 style="margin-top:0">Tables</h2><div class="manager-form"><div><label class="small">Table number</label><input id="newTableNo" placeholder="T7"></div><button class="btn primary" id="addTableBtn">Add table</button></div><div id="tableList" class="table-grid"><div class="empty empty-wide">Loading tables…</div></div></section></section>
</main><script src="supabase-config.js"></script><script type="module" src="supabase-admin.js?v=20260926-2"></script></body></html>
